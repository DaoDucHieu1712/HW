# HW and the Agent Platform — the infrastructure they share, plus each of them as an optional container.
#
#   docker compose up -d                        MariaDB, Redis and Seq (the default set)
#   docker compose --profile app up -d          ... plus HW.Api, containerised
#   docker compose --profile rabbitmq up -d     ... plus RabbitMQ
#   docker compose --profile all up -d          everything
#   docker compose down                         stop, keeping data
#   docker compose down -v                      stop and discard the volumes
#
#   docker compose run --rm agent-platform status                      what the platform wired up
#   docker compose run --rm agent-platform --dry-run run "/fixbug DEMO-1"   full graph, zero tokens
#   docker compose run --rm agent-platform run "/fixbug BUG-123"       for real
#
# The default set is still infrastructure only: while the API is the thing being debugged, F5 in
# the IDE is a faster loop than rebuilding an image, and every infrastructure port below matches what
# HW.Api/appsettings.Development.json points at. The "app" profile is for running HW without an IDE —
# it publishes on 5080, not 5000, so it can run next to an IDE-hosted instance without a port clash.
#
# The schema is not created on startup (Program.cs never calls Migrate). Apply the migrations from
# the host once MariaDB is healthy — port 3306 is published, so the development connection string works:
#   dotnet ef database update --project HW.Infrastructure --startup-project HW.Api
#
# The agent platform is a CLI, not a server: it runs one command and exits, so drive it with
# `docker compose run` rather than `up`. It reads agent-platform/.env for credentials (ANTHROPIC_API_KEY,
# JIRA_*, GITHUB_*); the in-container addresses below override whatever that file says about hosts.
#
# RabbitMQ sits behind a profile because "Messaging:Provider" is "None" in development — starting a
# broker nothing publishes to costs memory for no benefit. Switch the provider to "RabbitMq" or
# "MassTransit" and start the profile together; both providers use this one container.

services:

  # ── Database ────────────────────────────────────────────────────────────────────────────
  # Root with no password, matching the development connection string. That is a deliberate
  # convenience for a container bound to localhost and holding disposable data; it is also why
  # this file must never be the one deployed anywhere.
  mariadb:
    image: mariadb:11.4
    container_name: hw-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: hw
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # healthcheck.sh ships with the image; --connect proves the server accepts connections,
      # not merely that the process is up, which is the distinction that matters to EF's first
      # migration attempt.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Cache ───────────────────────────────────────────────────────────────────────────────
  # L2 behind TwoTierCacheService. The app degrades to its in-process L1 if this is missing,
  # so it is safe to stop on its own.
  redis:
    image: redis:7-alpine
    container_name: hw-redis
    restart: unless-stopped
    # Append-only persistence: cache contents survive a restart, which keeps a debugging session
    # reproducible instead of starting cold every time.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Logs ────────────────────────────────────────────────────────────────────────────────
  # Where Serilog ships structured events. http://localhost:5341 serves both the UI and the
  # ingestion endpoint — the address in the "Seq" configuration section. Inside the compose
  # network the same server is http://seq, which is what both containers below are given.
  seq:
    image: datalust/seq:latest
    container_name: hw-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Keeps Seq's cache off the host's RAM ceiling on a developer machine that is also running
      # a database, a broker and an IDE.
      SEQ_CACHE_SYSTEMRAMTARGET: "0.4"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Message broker ──────────────────────────────────────────────────────────────────────
  # Serves both "Messaging:Provider": "RabbitMq" and "MassTransit" — MassTransit runs over the
  # same broker with its own queue and error-queue conventions. Switching between the two leaves
  # the old provider's queues behind in the management UI; they are not interchangeable, so
  # delete them rather than expecting the new provider to drain them.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hw-rabbitmq
    restart: unless-stopped
    profiles: ["rabbitmq", "all"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: "/"
    ports:
      - "5672:5672"    # AMQP — what the app connects to
      - "15672:15672"  # Management UI — http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── HW API ──────────────────────────────────────────────────────────────────────────────
  # The same Development configuration the IDE runs, with every "localhost" swapped for the
  # compose service name. Configuration keys use the double-underscore form ASP.NET Core maps
  # onto the ":" hierarchy, so appsettings.Development.json itself is left untouched.
  hw-api:
    build:
      context: .
      dockerfile: HW.Api/Dockerfile
    image: hw-api:dev
    container_name: hw-api
    restart: unless-stopped
    profiles: ["app", "all"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "server=mariadb;port=3306;database=hw;User=root;Password="
      Cache__RedisConnection: "redis:6379"
      Seq__ServerUrl: "http://seq"
      Messaging__RabbitMq__HostName: rabbitmq
      # The code-reading agents discover the root by walking up to a solution file, which a
      # published image does not have; the repository is mounted here instead.
      Workspace__Root: /workspace
      # Passed through from the shell (or a .env next to this file) when set, absent otherwise —
      # the SDKs read these variables themselves, so a key never has to enter appsettings.
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      GEMINI_API_KEY:
    ports:
      - "${HW_API_PORT:-5080}:8080"   # http://localhost:5080/swagger
    volumes:
      # Read-write on purpose: the patch agents apply proposals to the source tree, exactly as they
      # do when the API runs from the IDE.
      - .:/workspace
      - hw-api-logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      seq:
        condition: service_started

  # ── Agent Platform ──────────────────────────────────────────────────────────────────────
  # Python + the .NET SDK in one image, because the agents' build and test tools shell out to
  # `dotnet build` / `dotnet test` against the mounted repository. The whole git repository is
  # mounted (its root is one level above this file) so the VCS tools can see .git; the agents'
  # workspace is the solution folder inside it.
  agent-platform:
    build:
      context: ./agent-platform
    image: hw-agent-platform:dev
    container_name: hw-agent-platform
    profiles: ["agent", "all"]
    restart: "no"
    env_file:
      - path: agent-platform/.env
        required: false
    environment:
      AGENT_WORKSPACE_ROOT: /repo/HW
      SEQ_BASE_URL: "http://seq"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ..:/repo
      # Checkpoints, long-term memory and the Chroma index outlive a `run --rm`.
      - agent-state:/app/.state
      - agent-logs:/app/logs
      # Every run would otherwise restore the solution's packages from nothing.
      - nuget-packages:/root/.nuget/packages
    depends_on:
      seq:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
  redis-data:
  seq-data:
  rabbitmq-data:
  hw-api-logs:
  agent-state:
  agent-logs:
  nuget-packages:
